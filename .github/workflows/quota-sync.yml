name: quota-sync

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Collect and push usage
        env:
          WORKER_PUSH_URL: ${{ secrets.WORKER_PUSH_URL }}
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
          COPILOT_TOKEN: ${{ secrets.COPILOT_TOKEN }}
          COPILOT_USERNAME: ${{ secrets.COPILOT_USERNAME }}
          COPILOT_ORG: ${{ secrets.COPILOT_ORG }}
          COPILOT_MONTHLY_ALLOWANCE: ${{ secrets.COPILOT_MONTHLY_ALLOWANCE }}
          GROK_TOKEN: ${{ secrets.GROK_TOKEN }}
          ANTHROPIC_ADMIN_KEY: ${{ secrets.ANTHROPIC_ADMIN_KEY }}
          AQM_PUSH_UNSUPPORTED: ${{ secrets.AQM_PUSH_UNSUPPORTED }}
        run: npx tsx scripts/run.ts
      - name: Run Worker notify check
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
        run: |
          if [ -z "$ADMIN_TOKEN" ] || [ -z "$WORKER_BASE_URL" ]; then
            echo "ADMIN_TOKEN or WORKER_BASE_URL missing; skip notify check"
            exit 0
          fi
          curl -fsS -X POST "${WORKER_BASE_URL%/}/v1/cron" \
            -H "Authorization: Bearer ${ADMIN_TOKEN}" \
            -H "Content-Type: application/json"
