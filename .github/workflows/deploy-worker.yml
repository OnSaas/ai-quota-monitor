name: deploy-worker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund || npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

  deploy:
    needs: check
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund || npm ci --no-audit --no-fund
      - run: npm run build
      - name: Check Cloudflare secrets
        id: cf
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -z "${CLOUDFLARE_API_TOKEN}" ]] && missing+=("CLOUDFLARE_API_TOKEN")
          [[ -z "${CLOUDFLARE_ACCOUNT_ID}" ]] && missing+=("CLOUDFLARE_ACCOUNT_ID")
          if ((${#missing[@]})); then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::缺少 ${missing[*]}，只完成构建，跳过 wrangler deploy"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy Worker
        if: steps.cf.outputs.ready == 'true'
        run: npx wrangler deploy
